[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psn_monitor"
version = "2.0.1"
description = "Tool implementing real-time tracking of Sony PlayStation (PSN) players activities"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]
authors = [{ name = "Michal Szymanski", email = "misiektoja-pypi@rm-rf.ninja" }]
requires-python = ">=3.10"
dependencies = [
  "PSNAWP>=3.0.3",
  "requests>=2.0",
  "python-dateutil>=2.8",
  "pytz>=2020.1",
  "tzlocal>=4.0",
  "python-dotenv>=0.19",
  "wcwidth>=0.2.7",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
]
keywords = ["psn", "playstation","monitoring", "tracking", "real-time", "osint", "psnawp"]

[project.optional-dependencies]
test = ["pytest>=7.0", "pyyaml>=6.0"]
# Pinned so a new ruff release cannot fail CI on a rule that did not exist when the change was written
lint = ["ruff==0.16.8"]

[project.urls]
Homepage = "https://github.com/misiektoja/psn_monitor"
Documentation = "https://misiektoja.github.io/psn_monitor/"
Source   = "https://github.com/misiektoja/psn_monitor"
Changelog= "https://github.com/misiektoja/psn_monitor/blob/main/RELEASE_NOTES.md"

[project.scripts]
psn_monitor = "psn_monitor:main"

[tool.setuptools]
py-modules = ["psn_monitor"]
include-package-data = true

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Defect rules only: syntax errors, pyflakes and bugbear. Formatting and import order are left
# to the surrounding code, which keeps each function definition on one physical line
select = ["E9", "F", "B"]
# Both are style preferences that would rewrite hundreds of existing lines without fixing a defect
ignore = ["F541", "B904"]

[tool.pytest.ini_options]
# Run the in-repo source, never an installed copy, by putting the project root first on sys.path
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
